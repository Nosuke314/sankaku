<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <title>△</title>
  <style>
    body {
  font-family: "Noto Sans JP", sans-serif;
  background-color: #f5f5f5;
  color: #222;
  text-align: center;
  margin: 0;
  padding: 30px 20px;
    }

  .start {
    width: 100%;
    mergin: 0 auto 20px;
}
    
    .question, #final {
  max-width: 600px;
  margin: 50px auto;
  text-align: center;
}

    .question img, #final img {
  display: block;
  width: 100%;
  margin: 0 auto 20px;
}

    input {
  padding: 12px;
  font-size: 16px;
  border: 1px solid #aaa;
  border-radius: 6px;
}

button {
  padding: 12px 20px;
  font-size: 16px;
  border: none;
  border-radius: 6px;
  background-color: #333;
  color: white;
  cursor: pointer;
}

button:hover {
  background-color: #666;
}

#final[hidden] {
  display: none;
}

    
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

#final:not([hidden]) {
  animation: fadeIn 1.5s ease-out;
}

    
#clear {
  max-width: 600px;
  margin: 50px auto;
  text-align: center;
}

#clear img {
  display: block;
  width: 100%;
  margin: 0 auto 20px;
}

#clear:not([hidden]) {
  animation: fadeIn 1.5s ease-out;
}

[hidden] {
  display: none !important;
}

  </style>
</head>
<body>
  <div class="start">
  <img src="△ - 2.png">
  </div>
  
  <p>この度は「△」をプレイしていただき誠にありがとうございます。</p>
  <p>細部までこだわった究極のデザインをご覧に！</p>
  <p>、、、なっていただきたかったのですが、変なバグが起きてしまいました。</p>
  <p>どうやら「三角以外のすべての要素が消されてしまった」ようです、、、</p>
  <p>まあなんとかなりますよね！頑張ってください！</p>
  <p>答えはすべてサンカクを読めば出てきますよ。</p>

  <div class="question">
    <img src="△ - 4.png">
    <input type="text" id="answer1" placeholder="カタカナで回答">
    <button onclick="checkAnswer(1)">回答する</button>
    <p id="result1"></p>
  </div>

  <div class="question">
    <img src="△ - 5.png">
    <input type="text" id="answer2" placeholder="カタカナで回答">
    <button onclick="checkAnswer(2)">回答する</button>
    <p id="result2"></p>
  </div>

  <div class="question">
    <img src="△ - 6.png">
    <input type="text" id="answer3" placeholder="カタカナで回答">
    <button onclick="checkAnswer(3)">回答する</button>
    <p id="result3"></p>
  </div>

  <div id="final" hidden>
    <img src="Untitled design.png">
    <input type="text" id="answer4" placeholder="カタカナで回答">
    <button onclick="checkAnswer(4)">回答する</button>
    <p id="result4"></p>
  </div>

  <div id="clear" hidden>
    <img src="△ - 3.png">
    <p>これ解けるんですね、驚きました。</p>
    <p>それにしても変なバグでしたね、、、あなたもお気を付けください。</p>
    <button onclick="shareX()">Xで自慢しよう！</button>
  </div>
    
  <script>
    const correctAnswers = ["サンカ","イヨク","ウインク","サヨウ"];

    const cleared = [false, false, false];

    function checkAnswer(number) {
      const answer = document.getElementById("answer" + number).value;
      const result  = document.getElementById("result" + number);

      if(answer === correctAnswers[number - 1]) {
        result.textContent = "正解！";

      if (number === 4) {
        document.getElementById("final").hidden = true;
        document.getElementById("clear").hidden = false;
        return;
      }

      if (number <= 3) {
        cleared[number -1] = true;
      }

      if(cleared.every(value => value === true)) {
        document.getElementById("final").hidden = false;
      }

    } else {
      result.textContent = "不正解。";
    }
    }

    
function shareX() {
  const text = "『△』から答えを導き出した\n#謎解き #サンカク";
  const url = "https://nosuke314.github.io/sankaku/index.html";

  const shareURL =
    "https://twitter.com/intent/tweet?text=" +
    encodeURIComponent(text) +
    "&url=" + encodeURIComponent(url);

  window.open(shareURL, "_blank");
}
 </script>
</body>
